# Selective Process Constraint (SPC) study on Helpdesk
# Strong baseline = attribute Transformer; SPC = soft legal + uncertainty gate.

seed: 42
dataset: helpdesk_spc
data_path: ../data/finale.csv
case_col: Case ID
activity_col: Activity
timestamp_col: Complete Timestamp

max_cases: null

train_ratio: 0.80
val_ratio: 0.10
test_ratio: 0.10
min_prefix_len: 1

embed_dim: 128
hidden_dim: 128
num_layers: 2
dropout: 0.2

# Practical backbone for SPC ablation (same family as Acc TF; lighter for CPU)
tf_embed_dim: 128
tf_hidden_dim: 128
tf_num_layers: 4
tf_nhead: 4
tf_dropout: 0.1
tf_pool_mode: mean_last
tf_learned_pos: false
use_time_feat: true
use_resource_feat: true
use_extra_attrs: true
attr_cols:
  - customer
  - product
  - responsible_section
  - seriousness_2
  - service_level
  - service_type
  - support_section
  - workgroup

soft_legal_lambda: 0.1
calibrate_gate: false
gate_tau: -1
# When calibrate_gate=true: gate_mode adaptive|p70
# gate_mode: adaptive
# gate_acc_budget: 0.005
# gate_noise_rate: 0.2
label_smoothing: 0.0

lr: 0.0005
weight_decay: 1.0e-5
batch_size: 64
epochs: 40
patience: 10
early_stop_metric: accuracy

discovery_noise_threshold: 0.2
device: cpu
output_dir: outputs
